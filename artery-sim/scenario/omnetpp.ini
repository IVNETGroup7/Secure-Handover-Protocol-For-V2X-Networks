[General]
network = HighwayHandover
sim-time-limit = 40s                # node[0] leaves the road at x = 1000 m about 38 s in
cmdenv-express-mode = true
cmdenv-autoflush = true
**.cmdenv-log-level = warn          # the protocol prints its own trace (stdout)

# results
output-scalar-file = ${resultdir}/${configname}-${runnumber}.sca
output-vector-file = ${resultdir}/${configname}-${runnumber}.vec
**.scalar-recording = true
**.vector-recording = true

# SUMO (TraCI): started by Artery, with the highway of highway.sumocfg
*.traci.core.version = -1
*.traci.launcher.typename = "PosixLauncher"
*.traci.launcher.sumocfg = "highway.sumocfg"
*.traci.launcher.sumo = "sumo"      # "sumo-gui" to watch it

# radios, vehicles and RSUs alike: ITS-G5 control channel, 5.9 GHz, 10 MHz, 6 Mbps
*.node[*].wlan[*].typename = "VanetNic"
*.node[*].wlan[*].radio.channelNumber = 180
*.node[*].wlan[*].radio.carrierFrequency = 5.9 GHz
*.node[*].wlan[*].bitrate = 6 Mbps
*.rsu[*].wlan[*].radio.channelNumber = 180
*.rsu[*].wlan[*].radio.carrierFrequency = 5.9 GHz
*.rsu[*].wlan[*].bitrate = 6 Mbps
*.node[*].wlan[*].radio.transmitter.power = 200 mW    # D250m_80211p's, unless a configuration says otherwise
*.rsu[*].wlan[*].radio.transmitter.power = 200 mW

# vehicles: the protocol's vehicle (services.xml)
*.node[*].middleware.updateInterval = 0.1s
*.node[*].middleware.datetime = "2026-10-18 12:00:00"
*.node[*].middleware.services = xmldoc("services.xml")
*.node[*].middleware.VehicleTeeService.firstRsu = "rsu[0]"
*.node[*].middleware.VehicleTeeService.startDelay = 0.5s
*.node[*].middleware.VehicleTeeService.dataInterval = 100ms     # 10 Hz, as CAMs
*.node[*].middleware.VehicleTeeService.dataSize = 200B
*.node[*].middleware.VehicleTeeService.handoverX = 500m         # rsu[0] / rsu[1] border

# RSUs: the OP-TEE gateway (services-rsu.xml), 10 m off the road, antennas 10 m high
*.rsu[*].middleware.updateInterval = 0.1s
*.rsu[*].middleware.datetime = "2026-10-18 12:00:00"
*.rsu[*].middleware.services = xmldoc("services-rsu.xml")
*.rsu[*].mobility.initialZ = 10m
*.rsu[0].mobility.initialX = 250m
*.rsu[0].mobility.initialY = 10m
*.rsu[1].mobility.initialX = 750m
*.rsu[1].mobility.initialY = 10m
*.rsu[0].middleware.TeeRsuService.nextRsu = "rsu[1]"           # Secrecy Forwarding rsu[0] -> rsu[1]

# backhaul: HTTPS sessions RSU <-> ESA and RSU <-> RSU
*.backhaulBroker.latency = 20ms

[Config D250m_80211p]
description = "IEEE 802.11p, 5.9 GHz, 6 Mbps, 200 mW: about 250 m per RSU"
network = HighwayHandover
*.node[*].wlan[*].radio.transmitter.power = 200 mW
*.rsu[*].wlan[*].radio.transmitter.power = 200 mW
*.node[*].middleware.VehicleTeeService.useSimu5g = false
*.rsu[*].middleware.TeeRsuService.useSimu5g = false

[Config D500m_5G]
description = "Simu5G: 5G NR (3.5 GHz FR1 n78, 20 MHz, numerology 1, 3GPP TR 38.901 UMi, gNodeB X2 handover, 500 m cell radius per RSU)"
network = HighwayHandover5G
*.node[*].middleware.VehicleTeeService.useSimu5g = true
*.rsu[*].middleware.TeeRsuService.useSimu5g = true

# Simu5G Carrier Aggregation & 5G NR Channel configuration
*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].carrierFrequency = 3.5GHz
*.carrierAggregation.componentCarrier[0].numBands = 50        # 20 MHz bandwidth (50 RBs)
*.carrierAggregation.componentCarrier[0].numerologyIndex = 1   # 30 kHz subcarrier spacing (5G NR standard)

# Simu5G Binder (global ID and cell association registry)
*.binder.numBands = 50

# 5G gNodeBs: co-located with RSUs at x=250m and x=750m, 10m antenna height
*.gnb[0].mobility.initialX = 250m
*.gnb[0].mobility.initialY = 10m
*.gnb[0].mobility.initialZ = 10m
*.gnb[1].mobility.initialX = 750m
*.gnb[1].mobility.initialY = 10m
*.gnb[1].mobility.initialZ = 10m

# gNodeB Radio & PHY (3GPP TR 38.901 Urban Microcell, 30 dBm Tx power)
*.gnb[*].cellularNic.numCarriers = 1
*.gnb[*].cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.gnb[*].cellularNic.channelModel[0].pathLossType = "Tr38901"
*.gnb[*].cellularNic.channelModel[0].scenario = "URBAN_MICROCELL"
*.gnb[*].cellularNic.phy.txPower = 30dBm

# 5G X2 Handover interface between gNodeB[0] and gNodeB[1]
*.gnb[*].cellularNic.numX2Apps = 1
*.gnb[*].cellularNic.x2Manager.typename = "LteX2Manager"

# Vehicles (5G NR User Equipment): cellular NIC, 23 dBm Tx power, automatic cell selection
*.node[*].cellularNic.typename = "NRNicUe"
*.node[*].cellularNic.numNrCarriers = 1
*.node[*].cellularNic.nrChannelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.node[*].cellularNic.nrChannelModel[0].pathLossType = "Tr38901"
*.node[*].cellularNic.nrChannelModel[0].scenario = "URBAN_MICROCELL"
*.node[*].cellularNic.phy.txPower = 23dBm
*.node[*].cellularNic.rrc.handoverAllowed = true
*.node[*].cellularNic.nas.targetCellSelection = "automatic"

# 5G NR radio broker parameters
*.backhaulBroker.nr5gLatency = 2ms
*.backhaulBroker.nrCellRadius = 500m
*.backhaulBroker.gnb0X = 250m
*.backhaulBroker.gnb1X = 750m

[Config HIL_RPi3_80211p]
description = "Hardware-in-the-Loop: rsu[0] bridged to physical Raspberry Pi 3 OP-TEE RSU via enp3s0"
network = HighwayHandover
scheduler-class = "omnetpp::cRealTimeScheduler"
*.node[*].wlan[*].radio.transmitter.power = 200 mW
*.rsu[*].wlan[*].radio.transmitter.power = 200 mW
*.node[*].middleware.VehicleTeeService.useSimu5g = false
*.rsu[*].middleware.TeeRsuService.useSimu5g = false
*.rsu[0].middleware.TeeRsuService.enableHil = true
*.rsu[0].middleware.TeeRsuService.hilIface = "enp3s0"

[Config HIL_RPi3_TargetHandover]
description = "Hardware-in-the-Loop Handover: rsu[0] simulated, rsu[1] physical Raspberry Pi 3 OP-TEE RSU"
network = HighwayHandover
scheduler-class = "omnetpp::cRealTimeScheduler"
*.node[*].wlan[*].radio.transmitter.power = 200 mW
*.rsu[*].wlan[*].radio.transmitter.power = 200 mW
*.node[*].middleware.VehicleTeeService.useSimu5g = false
*.rsu[*].middleware.TeeRsuService.useSimu5g = false
*.rsu[1].middleware.TeeRsuService.enableHil = true
*.rsu[1].middleware.TeeRsuService.hilIface = "enp3s0"
