[General]
network = HighwayHandover
sim-time-limit = 40s                # node[0] leaves the road at x = 1000 m about 38 s in
cmdenv-express-mode = true
cmdenv-autoflush = true
**.cmdenv-log-level = warn          # the protocol prints its own trace (stdout)

# results
output-scalar-file = ${resultdir}/${configname}-${runnumber}.sca
output-vector-file = ${resultdir}/${configname}-${runnumber}.vec
**.scalar-recording = true
**.vector-recording = true

# SUMO (TraCI): started by Artery, with the highway of highway.sumocfg
*.traci.core.version = -1
*.traci.launcher.typename = "PosixLauncher"
*.traci.launcher.sumocfg = "highway.sumocfg"
*.traci.launcher.sumo = "sumo"      # "sumo-gui" to watch it

# radios, vehicles and RSUs alike: ITS-G5 control channel, 5.9 GHz, 10 MHz, 6 Mbps
*.node[*].wlan[*].typename = "VanetNic"
*.node[*].wlan[*].radio.channelNumber = 180
*.node[*].wlan[*].radio.carrierFrequency = 5.9 GHz
*.node[*].wlan[*].bitrate = 6 Mbps
*.rsu[*].wlan[*].radio.channelNumber = 180
*.rsu[*].wlan[*].radio.carrierFrequency = 5.9 GHz
*.rsu[*].wlan[*].bitrate = 6 Mbps
*.node[*].wlan[*].radio.transmitter.power = 200 mW    # D250m_80211p's, unless a configuration says otherwise
*.rsu[*].wlan[*].radio.transmitter.power = 200 mW

# vehicles: the protocol's vehicle (services.xml)
*.node[*].middleware.updateInterval = 0.1s
*.node[*].middleware.datetime = "2026-10-18 12:00:00"
*.node[*].middleware.services = xmldoc("services.xml")
*.node[*].middleware.VehicleTeeService.firstRsu = "rsu[0]"
*.node[*].middleware.VehicleTeeService.startDelay = 0.5s
*.node[*].middleware.VehicleTeeService.dataInterval = 100ms     # 10 Hz, as CAMs
*.node[*].middleware.VehicleTeeService.dataSize = 200B
*.node[*].middleware.VehicleTeeService.handoverX = 500m         # rsu[0] / rsu[1] border

# RSUs: the SGX gateway (services-rsu.xml), 10 m off the road, antennas 10 m high
*.rsu[*].middleware.updateInterval = 0.1s
*.rsu[*].middleware.datetime = "2026-10-18 12:00:00"
*.rsu[*].middleware.services = xmldoc("services-rsu.xml")
*.rsu[*].mobility.initialZ = 10m
*.rsu[0].mobility.initialX = 250m
*.rsu[0].mobility.initialY = 10m
*.rsu[1].mobility.initialX = 750m
*.rsu[1].mobility.initialY = 10m
*.rsu[*].middleware.TeeRsuService.enclavePath = "../../rsu-sgx-gateway/enclave.signed.so"
*.rsu[0].middleware.TeeRsuService.nextRsu = "rsu[1]"           # Secrecy Forwarding rsu[0] -> rsu[1]

# backhaul: HTTPS sessions RSU <-> ESA and RSU <-> RSU
*.backhaulBroker.latency = 20ms

[Config D250m_80211p]
description = "IEEE 802.11p, 5.9 GHz, 6 Mbps, 200 mW: about 250 m per RSU"
*.node[*].wlan[*].radio.transmitter.power = 200 mW
*.rsu[*].wlan[*].radio.transmitter.power = 200 mW

[Config D500m_5G]
description = "5.9 GHz, 6 Mbps, 631 mW (the 5G setting's power on the ITS-G5 radio): about 500 m per RSU"
*.node[*].wlan[*].radio.transmitter.power = 631 mW
*.rsu[*].wlan[*].radio.transmitter.power = 631 mW
