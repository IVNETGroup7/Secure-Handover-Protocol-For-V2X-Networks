[General]
network = HighwayHandover
sim-time-limit = 85s                # node[0] traverses all 4 edges of the 400x400 m Manhattan grid (~83 s)
cmdenv-express-mode = true
cmdenv-autoflush = true
**.cmdenv-log-level = warn          # the protocol prints its own trace (stdout)

# results
output-scalar-file = ${resultdir}/${configname}-${runnumber}.sca
output-vector-file = ${resultdir}/${configname}-${runnumber}.vec
**.scalar-recording = true
**.vector-recording = true

# SUMO (TraCI): started by Artery, with the 3x3 Manhattan grid of highway.sumocfg
*.traci.core.version = -1
*.traci.launcher.typename = "PosixLauncher"
*.traci.launcher.sumocfg = "highway.sumocfg"
*.traci.launcher.sumo = "sumo"      # "sumo-gui" to watch it

# radios, vehicles and RSUs alike: ITS-G5 control channel, 5.9 GHz, 10 MHz, 6 Mbps
*.node[*].wlan[*].typename = "VanetNic"
*.node[*].wlan[*].radio.channelNumber = 180
*.node[*].wlan[*].radio.carrierFrequency = 5.9 GHz
*.node[*].wlan[*].bitrate = 6 Mbps
*.rsu[*].wlan[*].radio.channelNumber = 180
*.rsu[*].wlan[*].radio.carrierFrequency = 5.9 GHz
*.rsu[*].wlan[*].bitrate = 6 Mbps
*.node[*].wlan[*].radio.transmitter.power = 200 mW    # D250m_80211p's, unless a configuration says otherwise
*.rsu[*].wlan[*].radio.transmitter.power = 200 mW

# vehicles: the protocol's vehicle + CTRA trajectory predictor (services.xml)
*.node[*].middleware.updateInterval = 0.1s
*.node[*].middleware.datetime = "2026-10-18 12:00:00"
*.node[*].middleware.services = xmldoc("services.xml")
*.node[*].middleware.VehicleTeeService.firstRsu = "rsu[0]"
*.node[*].middleware.VehicleTeeService.startDelay = 0.5s
*.node[*].middleware.VehicleTeeService.dataInterval = 100ms     # 10 Hz, as CAMs
*.node[*].middleware.VehicleTeeService.dataSize = 200B
*.node[*].middleware.VehicleTeeService.enableCtra = true        # CTRA trajectory predictor selects single target RSU
*.node[*].middleware.VehicleTeeService.predictionHorizon = 8.0s
*.node[*].middleware.VehicleTeeService.predictionStep = 0.1s
*.node[*].middleware.VehicleTeeService.predictRadius = 80m      # pre-fetch tokens when CTRA trajectory passes <= 80 m of RSU
*.node[*].middleware.VehicleTeeService.handoverRadius = 160m    # execute Forwarding_Request when <= 160 m & closer than current RSU

# 4 RSUs on the 4 edges of the 400x400 m Manhattan Grid (services-rsu.xml), antennas 10 m high:
#   rsu[0]: West edge  (10 m, 200 m)  -> OP-TEE TA session #1 (rsu0.sealed)
#   rsu[1]: North edge (200 m, 10 m)  -> OP-TEE TA session #2 (rsu1.sealed)
#   rsu[2]: East edge  (390 m, 200 m) -> OP-TEE TA session #3 (rsu2.sealed)
#   rsu[3]: South edge (200 m, 390 m) -> OP-TEE TA session #4 (rsu3.sealed)
*.rsu[*].middleware.updateInterval = 0.1s
*.rsu[*].middleware.datetime = "2026-10-18 12:00:00"
*.rsu[*].middleware.services = xmldoc("services-rsu.xml")
*.rsu[*].middleware.TeeRsuService.nextRsu = ""                  # no static broadcast/push: CTRA Handover_Predict drives pre-fetch
*.rsu[*].mobility.initialZ = 10m
*.rsu[0].mobility.initialX = 10m
*.rsu[0].mobility.initialY = 200m
*.rsu[1].mobility.initialX = 200m
*.rsu[1].mobility.initialY = 10m
*.rsu[2].mobility.initialX = 390m
*.rsu[2].mobility.initialY = 200m
*.rsu[3].mobility.initialX = 200m
*.rsu[3].mobility.initialY = 390m

# backhaul: HTTPS sessions RSU <-> ESA and RSU <-> RSU
*.backhaulBroker.latency = 20ms

[Config D250m_80211p]
description = "Manhattan Grid (4 RSUs, 4 OP-TEE TA sessions) + CTRA trajectory predictor (IEEE 802.11p, 5.9 GHz, 6 Mbps, 200 mW)"
network = HighwayHandover
*.node[*].wlan[*].radio.transmitter.power = 200 mW
*.rsu[*].wlan[*].radio.transmitter.power = 200 mW

[Config HIL_RPi3_QuadRsu]
description = "Hardware-in-the-Loop 4-RSU Manhattan Grid: ALL 4 RSUs (rsu[0]..rsu[3]) in 4 isolated Raspberry Pi 3 OP-TEE TA sessions"
network = HighwayHandover
*.node[*].wlan[*].radio.transmitter.power = 200 mW
*.rsu[*].wlan[*].radio.transmitter.power = 200 mW
*.rsu[*].middleware.TeeRsuService.enableHil = true

[Config HIL_RPi3_QuadRsu_GUI]
description = "Hardware-in-the-Loop 4-RSU Manhattan Grid on physical Raspberry Pi 3 OP-TEE (SUMO GUI visualizer)"
extends = HIL_RPi3_QuadRsu
*.traci.launcher.sumo = "sumo-gui"
*.traci.launcher.extraOptions = "--start"

[Config D250m_80211p_GUI]
description = "Pure 802.11p 4-RSU Manhattan Grid + CTRA simulation (SUMO GUI visualizer)"
extends = D250m_80211p
*.traci.launcher.sumo = "sumo-gui"
*.traci.launcher.extraOptions = "--start"
