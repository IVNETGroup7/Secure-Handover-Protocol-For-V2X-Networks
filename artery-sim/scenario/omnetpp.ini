[General]
network = HighwayHandover
sim-time-limit = 85s                # node[0] traverses all 4 edges of the 400x400 m Manhattan grid (~83 s)
cmdenv-express-mode = true
cmdenv-autoflush = true
**.cmdenv-log-level = warn          # the protocol prints its own trace (stdout)
**.routingRecorder.enabled = false
**.sctp.**.scalar-recording = false
**.sctp.**.vector-recording = false

# results (unique per run; run-sim.sh overrides with <config>-<otp>-<YYYYMMDD-HHMMSS>)
output-scalar-file = ${resultdir}/${configname}-${runnumber}-${datetime}.sca
output-vector-file = ${resultdir}/${configname}-${runnumber}-${datetime}.vec
**.scalar-recording = true
**.vector-recording = true

# Coordinate converter (400 m x 400 m local Cartesian Manhattan Grid)
*.coordConverter.typename = "OsgCoordConverterLocal"
*.coordConverter.srs_code = "EPSG:32632"
*.coordConverter.offset_x = 0m
*.coordConverter.offset_y = 0m
*.coordConverter.xBound = 400m
*.coordConverter.yBound = 400m
**.coordConverterModule = "coordConverter"

# SUMO (TraCI): connects to host SUMO 1.26.0 launched by run-sim.sh / run-hil-quad.sh
*.traci.core.typename = "Core"
*.traci.core.version = -1
*.traci.core.selfStopping = false
*.traci.launcher.typename = "ConnectLauncher"
*.traci.launcher.hostname = "127.0.0.1"
*.traci.launcher.port = 9999
*.traci.mapper.typename = "BasicModuleMapper"
*.traci.mapper.personType = "crownet.nodes.ApplicationLayerPedestrian"
*.traci.mapper.vehicleType = "crownet.nodes.ApplicationLayerVehicle"
*.traci.nodes.typename = "SumoCombinedNodeManager"
*.traci.nodes.vehicleSinkModule = ".mobility"
*.traci.nodes.personSinkModule = ".mobility"
*.traci.nodes.vehicleNode = "node"
*.traci.nodes.personNode = "pNode"
*.traci.nodes.ignoreVehicle = false
*.traci.nodes.ignorePersons = true

# ==============================================================================
# 5G NR Radio Access Network (Simu5G via CrowNet)
#   3.5 GHz n78 NR carrier, numerology u=1 (30 kHz SCS), 25 RBs, full-mesh X2 handover
# ==============================================================================
*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].numerologyIndex = 1
*.carrierAggregation.componentCarrier[0].carrierFrequency = 3.5GHz
*.carrierAggregation.componentCarrier[0].numBands = 25

**.amcType = "NrAmc"
**.pilotMode = "ROBUST_CQI"
**.targetBler = 0.01
**.blerShift = 5
**.fbPeriod = 40tti
**.downlink_interference = true
**.uplink_interference = true
**.ueTxPower = 26dBm
**.eNodeBTxPower = 30dBm

# 4 5G NR gNodeBs positioned on the 4 edges of the 400x400 m Manhattan Grid (10 m height)
*.gNB[*].mobility.initFromDisplayString = false
*.gNB[*].mobility.initialZ = 10m
*.gNB[*].cellularNic.typename = "NrNicEnb"
*.gNB[*].cellularNic.numCarriers = 1
*.gNB[*].cellularNic.channelModel[0].componentCarrierIndex = 0
*.gNB[*].cellularNic.LteChannelModelType = "NrChannelModel"
*.gNB[*].cellularNic.phy.enableHandover = true
*.gNB[*].cellularNic.phy.handoverLatency = 50ms
*.gNB[*].cellInfo.broadcastMessageInterval = 0.2s

*.gNB[0].macCellId = 1
*.gNB[0].macNodeId = 1
*.gNB[0].mobility.initialX = 10m
*.gNB[0].mobility.initialY = 200m

*.gNB[1].macCellId = 2
*.gNB[1].macNodeId = 2
*.gNB[1].mobility.initialX = 200m
*.gNB[1].mobility.initialY = 10m

*.gNB[2].macCellId = 3
*.gNB[2].macNodeId = 3
*.gNB[2].mobility.initialX = 390m
*.gNB[2].mobility.initialY = 200m

*.gNB[3].macCellId = 4
*.gNB[3].macNodeId = 4
*.gNB[3].mobility.initialX = 200m
*.gNB[3].mobility.initialY = 390m

# Full-mesh X2/Xn SCTP links across gNB[0..3]
*.gNB[*].numX2Apps = 3
*.gNB[*].x2App[*].server.localPort = 5000 + ancestorIndex(1)
**.sctp.nagleEnabled = false
**.sctp.enableHeartbeats = false

*.gNB[0].x2App[0].client.connectAddress = "gNB[1]%x2ppp0"
*.gNB[0].x2App[1].client.connectAddress = "gNB[2]%x2ppp0"
*.gNB[0].x2App[2].client.connectAddress = "gNB[3]%x2ppp0"

*.gNB[1].x2App[0].client.connectAddress = "gNB[0]%x2ppp0"
*.gNB[1].x2App[1].client.connectAddress = "gNB[2]%x2ppp1"
*.gNB[1].x2App[2].client.connectAddress = "gNB[3]%x2ppp1"

*.gNB[2].x2App[0].client.connectAddress = "gNB[0]%x2ppp1"
*.gNB[2].x2App[1].client.connectAddress = "gNB[1]%x2ppp1"
*.gNB[2].x2App[2].client.connectAddress = "gNB[3]%x2ppp2"

*.gNB[3].x2App[0].client.connectAddress = "gNB[0]%x2ppp2"
*.gNB[3].x2App[1].client.connectAddress = "gNB[1]%x2ppp2"
*.gNB[3].x2App[2].client.connectAddress = "gNB[2]%x2ppp2"

# ==============================================================================
# Vehicles (CrowNet ApplicationLayerVehicle: Simu5G NrNicUe + Artery Middleware)
# ==============================================================================
*.node[*].useNr = true
*.node[*].hasCellular = true
*.node[*].hasWlan = false
*.node[*].hasUdp = true
*.node[*].hasTcp = false
*.node[*].useArtery = true
*.node[*].servingNodeId = 0
*.node[*].nrServingNodeId = 1
*.node[*].cellularNic.numCarriers = 1
*.node[*].cellularNic.nrChannelModel[0].componentCarrierIndex = 0
*.node[*].cellularNic.LteChannelModelType = "NrChannelModel"
*.node[*].cellularNic.nrPhy.dynamicCellAssociation = true
*.node[*].cellularNic.nrPhy.enableHandover = true
*.node[*].ipv4.configurator.interfaces = "cellular"
*.node[*].ipv4.configurator.addressBase = "10.0.1.0"
*.node[*].ipv4.configurator.netmask = "255.0.0.0"
*.node[*].nTable.typename = ""
*.node[*].nTableClient.typename = ""
*.node[*].middleware.updateInterval = 0.1s
*.node[*].middleware.datetime = "2026-10-18 12:00:00"
*.node[*].middleware.services = xml("<services />")
*.node[*].middleware.identityRegistryModule = "identityRegistry"
*.node[*].vanetza.router.disableBeaconing = true

# Vehicle V2X security & purely kinematic CTRA app over 5G NR UDP port 2025
*.node[*].numApps = 1
*.node[*].app[0].typename = "VehicleTeeService"
*.node[*].app[0].localPort = 2025
*.node[*].app[0].destPort = 2025
*.node[*].app[0].firstRsu = "rsu[0]"
*.node[*].app[0].startDelay = 0.5s
*.node[*].app[0].dataInterval = 100ms     # 10 Hz, as CAMs
*.node[*].app[0].dataSize = 200B
*.node[*].app[0].enableCtra = true        # Purely kinematic CTRA predictor selects single target RSU
*.node[*].app[0].predictionHorizon = 8.0s
*.node[*].app[0].predictionStep = 0.1s
*.node[*].app[0].predictRadius = 80m      # Pre-fetch tokens when CTRA trajectory passes <= 80 m of RSU
*.node[*].app[0].handoverRadius = 160m    # Execute Forwarding_Request when <= 160 m & closer than current RSU

# ==============================================================================
# 4 Edge OP-TEE RSU Gateways co-located with gNB[0..3] on the 4 Manhattan edges:
#   rsu[0]: West edge  (10 m, 200 m)  -> OP-TEE TA session #1 (rsu0.sealed)
#   rsu[1]: North edge (200 m, 10 m)  -> OP-TEE TA session #2 (rsu1.sealed)
#   rsu[2]: East edge  (390 m, 200 m) -> OP-TEE TA session #3 (rsu2.sealed)
#   rsu[3]: South edge (200 m, 390 m) -> OP-TEE TA session #4 (rsu3.sealed)
# ==============================================================================
*.rsu[*].mobility.typename = "StationaryMobility"
*.rsu[*].mobility.initFromDisplayString = false
*.rsu[*].mobility.initialZ = 10m
*.rsu[0].mobility.initialX = 10m
*.rsu[0].mobility.initialY = 200m
*.rsu[1].mobility.initialX = 200m
*.rsu[1].mobility.initialY = 10m
*.rsu[2].mobility.initialX = 390m
*.rsu[2].mobility.initialY = 200m
*.rsu[3].mobility.initialX = 200m
*.rsu[3].mobility.initialY = 390m

*.rsu[*].numApps = 1
*.rsu[*].app[0].typename = "TeeRsuService"
*.rsu[*].app[0].localPort = 2025
*.rsu[*].app[0].vehiclePort = 2025

# Backhaul: mutually-authenticated HTTPS sessions RSU <-> ESA and RSU <-> RSU
*.backhaulBroker.latency = 20ms

[Config NR_5G]
description = "5G NR Manhattan Grid (CrowNet: Artery + Simu5G, 4 gNodeBs + 4 OP-TEE RSUs) + purely kinematic CTRA predictor"
network = HighwayHandover

[Config NR_5G_GUI]
description = "5G NR Manhattan Grid + purely kinematic CTRA simulation (SUMO GUI visualizer)"
extends = NR_5G

[Config HIL_RPi3_QuadRsu]
description = "Hardware-in-the-Loop 5G NR 4-RSU Manhattan Grid: ALL 4 RSUs (rsu[0]..rsu[3]) in 4 isolated Raspberry Pi 3 / VM OP-TEE TA sessions"
extends = NR_5G
*.rsu[*].app[0].enableHil = true
*.backhaulBroker.quietTrace = true  # focused evaluation milestones + report + CSV (use --verbose / V2X_VERBOSE=1 for full trace)

[Config HIL_RPi3_QuadRsu_GUI]
description = "Hardware-in-the-Loop 5G NR 4-RSU Manhattan Grid on physical Raspberry Pi 3 / VM OP-TEE (SUMO GUI visualizer)"
extends = HIL_RPi3_QuadRsu
